name: Android Unit Test

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ユニットテストに加え、スクリーンショットテストをゴールデン画像と比較検証する
      - name: Run unit tests with screenshot verification
        run: ./gradlew test -Proborazzi.test.verify=true

      # VRT で差分が出た場合、比較画像とレポートを確認できるようにアップロードする
      - name: Upload screenshot diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diff
          path: |
            app/build/outputs/roborazzi
            app/build/reports/roborazzi
          retention-days: 7
